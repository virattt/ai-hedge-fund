<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1460" viewBox="0 0 2400 1460" role="img" aria-labelledby="title description">
  <title id="title">AI Hedge Fund system architecture</title>
  <desc id="description">A user configures analysts and strategies, capital allocations and risk limits, rebalance cadence and benchmark, tickers and dates, and the LLM model. Configuration feeds the fund engine as a whole. Market data and LLM providers support investor agents and quantitative models. Their views feed portfolio construction and fund-level risk checks. Before simulated execution, the engine refreshes the assessment using information through the prior day. Trades use the next completed session's closing prices. Backtests and reports show daily performance, benchmark comparisons, decisions, and trades.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #000; text-anchor: middle; }
      .title { font-size: 88px; font-weight: 700; }
      .subtitle { font-size: 48px; }
      .group-title { font-size: 34px; font-weight: 700; }
      .node-title { font-size: 34px; }
      .config-title { font-size: 30px; }
      .edge-label { font-size: 28px; paint-order: stroke; stroke: #fff; stroke-width: 10px; stroke-linejoin: round; }
      .boundary { fill: none; stroke: #000; stroke-width: 2.5px; stroke-dasharray: 8 8; }
      .node { stroke: #000; stroke-width: 2.5px; }
      .edge { fill: none; stroke: #000; stroke-width: 2.5px; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="strokeWidth">
      <path d="M0 1 L11 6 L0 11 L3 6 Z" fill="#000"/>
    </marker>
  </defs>

