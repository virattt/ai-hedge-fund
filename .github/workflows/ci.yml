name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Offline pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==1.8.5

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run pytest without live API keys
        env:
          # Headless matplotlib for event-study plot unit tests.
          MPLBACKEND: Agg
        run: poetry run pytest hedge_fund --strict-markers
        # Do not inject FINANCIAL_DATASETS_API_KEY or LLM keys.
        # Tests marked live skip when those variables are unset.
