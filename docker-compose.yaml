services:
  backtester:
    build:
      context: .
      dockerfile: Dockerfile
    image: guestros/ai-hedge-fund:latest
    volumes:
      - ./.env:/app/.env
    command: poetry run python -m hedge_fund.backtesting --help  # v1 src/backtester.py was removed upstream; set real args
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
    tty: true
    stdin_open: true

