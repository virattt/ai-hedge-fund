# An example mandate. Specs are data: the fund builder (aihf),
# a chat LLM, and the strategy generator all emit this same format.
#
# Note there are no tickers here. A mandate is the DESK — its strategies,
# staff, risk, capital, and cadence — and can be pointed at any names; the
# universe is fixed when you backtest or deploy it (--universe).
#
#   aihf backtest ~/.hedge-fund/mandates/example.yaml --universe AAPL,MSFT
#   aihf paper create alpha --mandate ~/.hedge-fund/mandates/example.yaml --universe AAPL,MSFT
#   aihf paper tick alpha
#
schema_version: 2
name: example-fund
strategies:
  - name: deep-value          # discretionary pod: Graham-led, long-only
    blend: {mode: long_only}
    weight: 0.6               # capital slice, relative to sibling strategies
    models:
      - name: graham
        weight: 2.0
      - name: buffett
      - name: munger
  - name: earnings-drift      # systematic pod: post-earnings drift
    blend: {mode: long_short}
    weight: 0.4
    models:
      - name: pead
risk:
  max_position_pct: 0.25      # master risk: no single name above 25% of equity
  max_gross_exposure: 1.0     # unlevered, across the netted book
  halve_drawdown_pct: 0.10    # 10% off the NAV peak: the book runs at half size until it recovers
  max_drawdown_pct: 0.20      # 20% off the NAV peak: sold to cash and kept there
  # max_net_exposure: 0.3     # |longs - shorts| band, for a long/short book
  # max_adv_pct: 0.05         # no order above 5% of 20-day average daily volume
  # max_beta: 0.5             # |book beta| to the benchmark; betas from a year of daily returns
  # max_sector_pct: 0.3       # |net weight| in any one sector
  # max_volatility: 0.15      # modelled annualized vol of the book (single-index model)
costs:                        # what every fill costs; these are the defaults
  spread_bps: 5               # half the bid-ask spread, paid on every side
  commission_per_share: 0.005 # dollars a share
  impact_coefficient: 1.0     # Y in the square-root law: Y x daily vol x sqrt(order / ADV)
  min_trade_pct: 0.005        # an add under 0.5% of equity waits; trims and closes always trade
allocation:                   # the scorecard moves the weights above; remove the block to keep them as written
  min_evidence: 20            # graded dates (analyst) or periods (strategy) before a weight moves
  slope: 0.25                 # weight = mandate x clip(1 + slope x t-stat, floor, cap)
  floor: 0.25                 # a cut analyst keeps a quarter, so it can earn its way back
  cap: 2.0
capital: 100000
rebalance: weekly             # daily | weekly | monthly — how often the fund trades
benchmark: SPY                # measured against; also the backtest's trading-day grid
